<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Run </title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="logged-in">

<header class="bg-blue-600 text-white py-4 px-6 flex justify-between items-center sticky top-0 z-40">
<h1 class="text-2xl font-bold">🚚 Room Run Dashboard</h1>
<div>
<span id="user-name" class="mr-4 font-bold"></span>
<button onclick="logout()" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600">Logout</button>
</div>
</header>

<section class="p-6 grid md:grid-cols-2 lg:grid-cols-3 gap-6">
<div class="bg-white p-4 rounded shadow hover-scale">
<h3 class="font-semibold mb-2">Your Orders</h3>
<p>Track your current and past deliveries.</p>
<div class="progress-bar mt-2">
<div class="progress-fill" style="width: 70%;"></div>
</div>
</div>

<div class="bg-white p-4 rounded shadow hover-scale">
<h3 class="font-semibold mb-2">Chat Support</h3>
<div id="chat-box" class="h-48 overflow-auto border p-2 mb-2"></div>
<div class="flex gap-2">
<input id="chat-input" class="flex-1 p-2 border rounded" placeholder="Type a message">
<button onclick="sendMessage()" class="bg-blue-600 text-white px-3 rounded hover:bg-blue-700">Send</button>
</div>
</div>

<div class="bg-white p-4 rounded shadow hover-scale">
<h3 class="font-semibold mb-2">Explore Items</h3>
<a href="explore.html" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Go to Explore</a>
</div>
</section>

<script src="js/main.js"></script>
<script>lucide.createIcons()</script>
</body>
</html>
