<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Run - Login/Register</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="flex flex-col md:flex-row min-h-screen">
<!-- Login Form -->
<div class="md:w-1/2 flex flex-col justify-center items-center bg-blue-600 text-white p-8">
<h2 class="text-4xl font-bold mb-6">Login</h2>
<form onsubmit="handleLogin(event)" class="w-full max-w-sm">
<label class="block mb-2">Email</label>
<input type="email" id="email" required class="w-full p-2 rounded text-black mb-4">
<label class="block mb-2">Password</label>
<input type="password" id="password" required class="w-full p-2 rounded text-black mb-4">
<button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-500 p-2 rounded font-bold">Login</button>
</form>
<p class="mt-4">Don't have an account? <a href="#register" class="underline" onclick="openModal('register-modal')">Register</a></p>
</div>

<!-- Right Side Image -->
<div class="md:w-1/2 bg-gray-100 flex items-center justify-center">
<img src="images/hero.jpg" class="rounded shadow-lg w-3/4">
</div>
</section>

<!-- Register Modal -->
<div id="register-modal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal('register-modal')">&times;</span>
<h2 class="text-2xl font-bold mb-4 text-center text-blue-600">Register</h2>
<form onsubmit="handleRegister(event)">
<label class="block mb-2">Name</label>
<input type="text" id="reg-name" required class="w-full p-2 rounded mb-2">
<label class="block mb-2">Email</label>
<input type="email" id="reg-email" required class="w-full p-2 rounded mb-2">
<label class="block mb-2">Password</label>
<input type="password" id="reg-password" required class="w-full p-2 rounded mb-4">
<button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Register</button>
</form>
</div>
</div>

<script src="js/main.js"></script>
<script>lucide.createIcons()</script>
</body>
</html>
